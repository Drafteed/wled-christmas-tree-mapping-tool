name: Build

on:
  push:
    # Pushes to main are built by the Pages workflow.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check code
        if: github.event_name == 'pull_request'
        run: npm run check
      - name: Build HTML
        run: npm run build
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: wled-mapping-tool
          path: dist/WLED_CHRISTMAS_TREE_MAPPING_TOOL.html
          if-no-files-found: error

