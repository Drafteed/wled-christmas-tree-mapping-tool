name: Build

on:
  push:
    # Pushes to main are built by the Pages workflow.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: wled-mapping-tool
          path: dist/WLED_CHRISTMAS_TREE_MAPPING_TOOL.html
          if-no-files-found: error

